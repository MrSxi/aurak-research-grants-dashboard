<div class="table-wrap"><table class="data">
  <tr><th>Source</th><th>Trigger</th><th>Started (UTC)</th><th>Status</th><th>New</th><th>Updated</th><th>Error</th></tr>
  {% for r in runs %}
  <tr><td>{{ r.source_key }}</td><td>{{ r.trigger }}</td><td class="nowrap">{{ r.started_at.strftime('%d %b %H:%M') }}</td>
      <td><span class="badge {{ 'green' if r.status == 'ok' else ('red' if r.status == 'error' else '') }}">{{ r.status }}</span></td>
      <td>{{ r.created }}</td><td>{{ r.updated }}</td><td class="small">{{ (r.error or '')|truncate(160) }}</td></tr>
  {% else %}<tr><td colspan="7" class="muted">No runs yet.</td></tr>{% endfor %}
</table></div>
