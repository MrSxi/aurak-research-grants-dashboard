<option value="">Select a person…</option>
<optgroup label="Faculty">{% for f in faculty %}<option value="faculty:{{ f.id }}" {{ 'selected' if owner_sel == 'faculty:' ~ f.id }}>{{ f.full_name }}</option>{% endfor %}</optgroup>
<optgroup label="Students">{% for s in students %}<option value="student:{{ s.id }}" {{ 'selected' if owner_sel == 'student:' ~ s.id }}>{{ s.full_name }}{% if s.email %} ({{ s.email }}){% endif %}</option>{% endfor %}</optgroup>
